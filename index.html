<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet Radar</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(13, 29, 48, .78);
      --cyan: #54f5e8;
      --blue: #5a9bff;
      --muted: #8ca5bb;
      --line: rgba(84, 245, 232, .15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #eefcff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(29, 104, 132, .22), transparent 45%),
        linear-gradient(145deg, #050b14, var(--bg) 55%, #0b1830);
    }
    .radar-card {
      width: min(100%, 920px);
      overflow: hidden;
      border: 1px solid rgba(84, 245, 232, .18);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(16, 35, 56, .9), rgba(6, 17, 31, .94));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .38), inset 0 1px rgba(255,255,255,.04);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 26px 30px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      direction: ltr;
    }
    h1 { margin: 7px 0 0; font-size: clamp(22px, 4vw, 32px); }
    .status {
      display: inline-flex; align-items: center; gap: 9px;
      color: #a8c4d5; font-size: 13px; white-space: nowrap;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 14px var(--cyan);
      animation: pulse 1.8s infinite;
    }
    .content {
      display: grid; grid-template-columns: 1.1fr .9fr;
      align-items: center; gap: 12px; padding: 24px 30px 30px;
    }
    .radar-wrap { position: relative; width: 100%; max-width: 430px; margin: auto; }
    .radar {
      position: relative; width: 100%; aspect-ratio: 1;
      overflow: hidden; border-radius: 50%;
      border: 1px solid rgba(84,245,232,.38);
      background:
        linear-gradient(rgba(84,245,232,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(84,245,232,.07) 1px, transparent 1px),
        radial-gradient(circle, rgba(35,133,144,.14), rgba(4,18,30,.8) 72%);
      background-size: 25px 25px, 25px 25px, auto;
      box-shadow: 0 0 38px rgba(84,245,232,.08), inset 0 0 45px rgba(84,245,232,.07);
    }
    .ring {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      border: 1px solid rgba(84,245,232,.25); border-radius: 50%;
    }
    .r1 { width: 25%; height: 25%; }
    .r2 { width: 50%; height: 50%; }
    .r3 { width: 75%; height: 75%; }
    .r4 { width: 100%; height: 100%; }
    .axis { position: absolute; background: rgba(84,245,232,.18); }
    .axis.h { height: 1px; left: 0; right: 0; top: 50%; }
    .axis.v { width: 1px; top: 0; bottom: 0; left: 50%; }
    .sweep {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg 292deg, rgba(84,245,232,.02) 315deg, rgba(84,245,232,.32) 355deg, transparent 360deg);
      animation: rotate 5s linear infinite;
    }
    .sweep::after {
      content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 50%;
      background: linear-gradient(transparent, var(--cyan));
      transform-origin: bottom;
      box-shadow: 0 0 9px var(--cyan);
    }
    .blip {
      position: absolute; width: 7px; height: 7px; border-radius: 50%;
      background: #b7fff9; box-shadow: 0 0 8px 3px rgba(84,245,232,.55);
      animation: blink 2s infinite;
    }
    .b1 { top: 27%; left: 61%; }
    .b2 { top: 63%; left: 30%; animation-delay: .6s; }
    .b3 { top: 43%; left: 75%; animation-delay: 1.1s; }
    .b4 { top: 72%; left: 62%; width: 4px; height: 4px; animation-delay: .3s; }
    .radar-center {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 96px; height: 96px; display: grid; place-items: center;
      text-align: center; border-radius: 50%;
      background: rgba(7,25,39,.94); border: 1px solid rgba(84,245,232,.4);
      box-shadow: 0 0 28px rgba(84,245,232,.16);
    }
    .radar-center strong { display: block; font-size: 25px; color: var(--cyan); direction: ltr; }
    .radar-center span { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .radar-label {
      position: absolute; color: rgba(153,207,218,.68); font-size: 10px;
      direction: ltr; letter-spacing: 1px;
    }
    .label-n { top: 9px; left: 50%; transform: translateX(-50%); }
    .label-e { right: 10px; top: 50%; transform: translateY(-50%); }
    .label-s { bottom: 9px; left: 50%; transform: translateX(-50%); }
    .label-w { left: 10px; top: 50%; transform: translateY(-50%); }
    .metrics { display: grid; gap: 12px; }
    .metric {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 19px 20px; border-radius: 17px;
      border: 1px solid rgba(255,255,255,.075); background: var(--panel);
    }
    .metric-left { display: flex; align-items: center; gap: 13px; }
    .metric-icon {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 13px; color: var(--cyan); background: rgba(84,245,232,.09);
      font-size: 21px;
    }
    .metric:nth-child(2) .metric-icon { color: var(--blue); background: rgba(90,155,255,.1); }
    .metric:nth-child(3) .metric-icon { color: #c3a0ff; background: rgba(195,160,255,.1); }
    .metric-label { color: #a1b7c8; font-size: 12px; }
    .metric-value { margin-top: 5px; font-size: 26px; font-weight: 750; letter-spacing: -.7px; direction: ltr; }
    .unit { font-size: 11px; color: #829caf; font-weight: 500; margin-left: 4px; }
    .bottom {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px 30px 24px; border-top: 1px solid rgba(255,255,255,.06);
      color: #7f9bad; font-size: 11px;
    }
    .live-tag { color: var(--cyan); direction: ltr; letter-spacing: 1.5px; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .45; box-shadow: 0 0 4px var(--cyan); } }
    @keyframes blink { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @media (max-width: 680px) {
      body { padding: 12px; }
      .top { padding: 22px 20px; align-items: flex-start; flex-direction: column; }
      .content { grid-template-columns: 1fr; padding: 20px; gap: 24px; }
      .radar-wrap { max-width: 340px; }
      .bottom { padding: 16px 20px 20px; }
      .metric { padding: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="radar-card">
    <header class="top">
      <div>
        <div class="eyebrow">NETWORK / TELEMETRY</div>
        <h1>رادار وضعیت اینترنت</h1>
      </div>
      <div class="status"><span class="dot"></span><span id="connectionStatus">نمایش آزمایشی</span></div>
    </header>

    <section class="content">
      <div class="radar-wrap">
        <div class="radar" aria-label="رادار متحرک تزئینی">
          <div class="ring r1"></div><div class="ring r2"></div>
          <div class="ring r3"></div><div class="ring r4"></div>
          <div class="axis h"></div><div class="axis v"></div>
          <div class="sweep"></div>
          <i class="blip b1"></i><i class="blip b2"></i><i class="blip b3"></i><i class="blip b4"></i>
          <span class="radar-label label-n">N / 00</span>
          <span class="radar-label label-e">E / 90</span>
          <span class="radar-label label-s">S / 180</span>
          <span class="radar-label label-w">W / 270</span>
          <div class="radar-center"><div><strong>NET</strong><span>RADAR ONLINE</span></div></div>
        </div>
      </div>

      <div class="metrics">
        <article class="metric">
          <div class="metric-left"><div class="metric-icon">↓</div><div><div class="metric-label">سرعت دانلود</div><div class="metric-value"><span id="download">84.6</span><span class="unit">Mbps</span></div></div></div>
        </article>
        <article class="metric">
          <div class="metric-left"><div class="metric-icon">↑</div><div><div class="metric-label">سرعت آپلود</div><div class="metric-value"><span id="upload">21.3</span><span class="unit">Mbps</span></div></div></div>
        </article>
        <article class="metric">
          <div class="metric-left"><div class="metric-icon">◷</div><div><div class="metric-label">پینگ</div><div class="metric-value"><span id="ping">18</span><span class="unit">ms</span></div></div></div>
        </article>
      </div>
    </section>

    <footer class="bottom">
      <span>مقادیر فعلی نمایشی هستند و سرعت واقعی را اندازه‌گیری نمی‌کنند.</span>
      <span class="live-tag">● RADAR ACTIVE</span>
    </footer>
  </main>
</body>
</html>
